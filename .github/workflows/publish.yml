name: Publish

# Manual until the PyPI pending publisher exists, so a release cannot produce a failed run.
# Once it does: dispatch this on the v0.1.0 tag, confirm it passes, then restore
# `release: types: [published]`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: PyPI accepts this job's identity, so no token is stored anywhere.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/agentpace/__init__.py)
          test "v$version" = "$TAG"
      - run: uv build
      - run: uv publish
