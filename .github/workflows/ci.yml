name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t .

  quality:
    name: Lint, types and published numbers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx ruff@0.17.4 check .
      - run: uvx ruff@0.17.4 format --check .
      - run: uvx mypy@2.4.1
      - name: Check data
        run: python -m agentpace validate
      - name: Check backtest numbers
        run: python -m agentpace backtest --check
      - name: Check the site's embedded data
        run: python -m agentpace site --check
      - name: Check README claims
        run: python -m agentpace claims --check
      - name: Check the model-offset-v1 experiment report
        run: python -m experiments.model_offset --check
      - name: The built package runs the README example
        # Installs from the checkout, so the example plan must come from the wheel's _bundled
        # folder. An empty home keeps any local data out of the output.
        env:
          PYTHONPATH: ""
          AGENTPACE_HOME: ${{ runner.temp }}/agentpace-home
        run: |
          uvx --from . agentpace estimate --example > "$RUNNER_TEMP/example.txt"
          python -I -c "import re, sys; want = re.search(r'<!-- claim:example_output -->\n(.*?)<!-- /claim -->', open('README.md', encoding='utf-8').read(), re.S).group(1).strip(); got = open(sys.argv[1], encoding='utf-8').read().strip(); sys.exit(0 if want == got else 'the installed --example output differs from the README')" "$RUNNER_TEMP/example.txt"
