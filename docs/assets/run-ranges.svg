<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" role="img" aria-label="How long subagent runs took, by task kind">
<title>How long subagent runs took, by task kind</title>

<style>
  svg {
    --text: #0b0b0b; --muted: #52514e; --grid: #e4e3df;
    --primary: #2a78d6; --second: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --text: #f0efec; --muted: #c3c2b7; --grid: #3a3a37;
      --primary: #3987e5; --second: #d95926;
    }
  }
  text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  .title { font-size: 15px; font-weight: 600; fill: var(--text); }
  .label { fill: var(--text); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .goal { stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .range { stroke: var(--primary); stroke-width: 8; stroke-linecap: round; }
  .dot { fill: var(--primary); stroke: var(--surface, none); }
  .second { fill: var(--second); }
  .tick { stroke: #ffffff; stroke-width: 2; }
</style>

<text class="title" x="0" y="20">How long subagent runs took, by task kind</text>
<text x="0" y="42">Bar runs from P50 to P90. The white tick marks P80. Log scale, seconds to hours.</text>
<line class="grid" x1="265.7" y1="56" x2="265.7" y2="214"/>
<text x="265.7" y="232" text-anchor="middle">60 s</text>
<line class="grid" x1="517.2" y1="56" x2="517.2" y2="214"/>
<text x="517.2" y="232" text-anchor="middle">10 min</text>
<text class="label" x="0" y="84.0">docs <tspan>n=21</tspan></text>
<g><title>docs: P50 45 s, P80 3 min, P90 6 min (n=21)</title><line class="range" x1="234.3" y1="80.0" x2="457.4" y2="80.0"/><line class="tick" x1="391.0" y1="76.0" x2="391.0" y2="84.0"/></g>
<text x="469.4" y="84.0">45 s to 6 min</text>
<text class="label" x="0" y="120.0">feature <tspan>n=1,353</tspan></text>
<g><title>feature: P50 56 s, P80 3 min, P90 24 min (n=1,353)</title><line class="range" x1="258.2" y1="116.0" x2="613.1" y2="116.0"/><line class="tick" x1="380.5" y1="112.0" x2="380.5" y2="120.0"/></g>
<text x="625.1" y="120.0">56 s to 24 min</text>
<text class="label" x="0" y="156.0">review <tspan>n=1,560</tspan></text>
<g><title>review: P50 2 min, P80 6 min, P90 12 min (n=1,560)</title><line class="range" x1="359.0" y1="152.0" x2="535.7" y2="152.0"/><line class="tick" x1="464.3" y1="148.0" x2="464.3" y2="156.0"/></g>
<text x="547.7" y="156.0">2 min to 12 min</text>
<text class="label" x="0" y="192.0">other <tspan>n=268</tspan></text>
<g><title>other: P50 9 min, P80 33 min, P90 53 min (n=268)</title><line class="range" x1="502.1" y1="188.0" x2="699.6" y2="188.0"/><line class="tick" x1="646.1" y1="184.0" x2="646.1" y2="192.0"/></g>
<text x="711.6" y="192.0">9 min to 53 min</text>
</svg>
