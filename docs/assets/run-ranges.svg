<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 892 272" width="892" height="272" role="img" aria-label="How long agent runs took, by task kind">
<title>How long agent runs took, by task kind</title>

<style>
  svg {
    --panel: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --grid: #e4e3df;
    --primary: #2a78d6; --second: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --panel: #1a1a19; --text: #f0efec; --muted: #c3c2b7; --grid: #3a3a37;
      --primary: #3987e5; --second: #d95926;
    }
  }
  .panel { fill: var(--panel); }
  text {
    font: 13px system-ui, -apple-system, "Segoe UI", sans-serif;
    fill: var(--muted);
    paint-order: stroke;
    stroke: var(--panel);
    stroke-width: 4px;
    stroke-linejoin: round;
  }
  .title { font-size: 15px; font-weight: 600; fill: var(--text); }
  .label { fill: var(--text); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .goal { stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .range { stroke: var(--primary); stroke-width: 8; stroke-linecap: round; }
  .dot { fill: var(--primary); }
  .second { fill: var(--second); }
  .tick { stroke: var(--panel); stroke-width: 2; }
</style>

<rect class="panel" x="-16" y="-16" width="892" height="272" rx="8"/>
<text class="title" x="0" y="20">How long agent runs took, by task kind</text>
<text x="0" y="42">Bar runs from P50 to P90. The gap marks P80. Log scale, seconds to hours.</text>
<line class="grid" x1="190.0" y1="56" x2="190.0" y2="214"/>
<text x="190.0" y="232" text-anchor="middle">30 s</text>
<line class="grid" x1="264.9" y1="56" x2="264.9" y2="214"/>
<text x="264.9" y="232" text-anchor="middle">1 min</text>
<line class="grid" x1="438.7" y1="56" x2="438.7" y2="214"/>
<text x="438.7" y="232" text-anchor="middle">5 min</text>
<line class="grid" x1="513.5" y1="56" x2="513.5" y2="214"/>
<text x="513.5" y="232" text-anchor="middle">10 min</text>
<line class="grid" x1="632.2" y1="56" x2="632.2" y2="214"/>
<text x="632.2" y="232" text-anchor="middle">30 min</text>
<line class="grid" x1="707.0" y1="56" x2="707.0" y2="214"/>
<text x="707.0" y="232" text-anchor="middle">1 h</text>
<text class="label" x="0" y="84.0">docs <tspan>n=21</tspan></text>
<g><title>docs: P50 45 s, P80 3 min, P90 6 min (n=21)</title><line class="range" x1="233.8" y1="80.0" x2="454.4" y2="80.0"/><line class="tick" x1="388.8" y1="76.0" x2="388.8" y2="84.0"/></g>
<text x="466.4" y="84.0">45 s to 6 min</text>
<text class="label" x="0" y="120.0">feature <tspan>n=1,353</tspan></text>
<g><title>feature: P50 56 s, P80 3 min, P90 24 min (n=1,353)</title><line class="range" x1="257.4" y1="116.0" x2="608.4" y2="116.0"/><line class="tick" x1="378.3" y1="112.0" x2="378.3" y2="120.0"/></g>
<text x="620.4" y="120.0">56 s to 24 min</text>
<text class="label" x="0" y="156.0">review <tspan>n=1,560</tspan></text>
<g><title>review: P50 2 min, P80 6 min, P90 12 min (n=1,560)</title><line class="range" x1="357.1" y1="152.0" x2="531.9" y2="152.0"/><line class="tick" x1="461.2" y1="148.0" x2="461.2" y2="156.0"/></g>
<text x="543.9" y="156.0">2 min to 12 min</text>
<text class="label" x="0" y="192.0">other <tspan>n=445</tspan></text>
<g><title>other: P50 8 min, P80 24 min, P90 43 min (n=445)</title><line class="range" x1="495.1" y1="188.0" x2="670.1" y2="188.0"/><line class="tick" x1="607.8" y1="184.0" x2="607.8" y2="192.0"/></g>
<text x="682.1" y="192.0">8 min to 43 min</text>
</svg>
