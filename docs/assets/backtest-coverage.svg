<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="760" height="382" role="img" aria-label="P80 coverage on the time split, per session">
<title>P80 coverage on the time split, per session</title>

<style>
  svg {
    --text: #0b0b0b; --muted: #52514e; --grid: #e4e3df;
    --primary: #2a78d6; --second: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --text: #f0efec; --muted: #c3c2b7; --grid: #3a3a37;
      --primary: #3987e5; --second: #d95926;
    }
  }
  text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  .title { font-size: 15px; font-weight: 600; fill: var(--text); }
  .label { fill: var(--text); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .goal { stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .range { stroke: var(--primary); stroke-width: 8; stroke-linecap: round; }
  .dot { fill: var(--primary); stroke: var(--surface, none); }
  .second { fill: var(--second); }
  .tick { stroke: #ffffff; stroke-width: 2; }
</style>

<text class="title" x="0" y="20">P80 coverage on the time split, per session</text>
<circle class="dot" cx="6" cy="38" r="5"/><text x="18" y="42">agentpace candidate</text><rect class="second" x="170" y="33" width="10" height="10"/><text x="188" y="42">baseline</text>
<line class="grid" x1="150.0" y1="72" x2="150.0" y2="356"/><text x="150.0" y="374" text-anchor="middle">0%</text>
<line class="grid" x1="258.0" y1="72" x2="258.0" y2="356"/><text x="258.0" y="374" text-anchor="middle">20%</text>
<line class="grid" x1="366.0" y1="72" x2="366.0" y2="356"/><text x="366.0" y="374" text-anchor="middle">40%</text>
<line class="grid" x1="474.0" y1="72" x2="474.0" y2="356"/><text x="474.0" y="374" text-anchor="middle">60%</text>
<line class="grid" x1="582.0" y1="72" x2="582.0" y2="356"/><text x="582.0" y="374" text-anchor="middle">80%</text>
<line class="grid" x1="690.0" y1="72" x2="690.0" y2="356"/><text x="690.0" y="374" text-anchor="middle">100%</text>
<line class="goal" x1="582.0" y1="68" x2="582.0" y2="356"/><text class="label" x="582.0" y="64" text-anchor="middle">target 80%</text>
<text class="label" x="0" y="97.0">global</text>
<g><title>global: 84.1%</title><circle class="dot" cx="603.9" cy="93.0" r="5"/></g>
<text x="613.9" y="97.0" text-anchor="start">84.1%</text>
<text class="label" x="0" y="127.0">kind</text>
<g><title>kind: 81.7%</title><circle class="dot" cx="591.2" cy="123.0" r="5"/></g>
<text x="601.2" y="127.0" text-anchor="start">81.7%</text>
<text class="label" x="0" y="157.0">backoff</text>
<g><title>backoff: 78.9%</title><circle class="dot" cx="576.1" cy="153.0" r="5"/></g>
<text x="586.1" y="157.0" text-anchor="start">78.9%</text>
<text class="label" x="0" y="187.0">shrunk</text>
<g><title>shrunk: 78.5%</title><circle class="dot" cx="574.0" cy="183.0" r="5"/></g>
<text x="584.0" y="187.0" text-anchor="start">78.5%</text>
<text class="label" x="0" y="217.0">weighted</text>
<g><title>weighted: 76.2%</title><circle class="dot" cx="561.4" cy="213.0" r="5"/></g>
<text x="571.4" y="217.0" text-anchor="start">76.2%</text>
<text class="label" x="0" y="247.0">human-guess</text>
<g><title>human-guess: 99.5%</title><rect class="second" x="682.2" y="238.0" width="10" height="10"/></g>
<text x="677.2" y="247.0" text-anchor="end">99.5%</text>
<text class="label" x="0" y="277.0">fixed-rounds</text>
<g><title>fixed-rounds: 59.7%</title><rect class="second" x="467.3" y="268.0" width="10" height="10"/></g>
<text x="482.3" y="277.0" text-anchor="start">59.7%</text>
<text class="label" x="0" y="307.0">rounds-oracle</text>
<g><title>rounds-oracle: 99.8%</title><rect class="second" x="684.1" y="298.0" width="10" height="10"/></g>
<text x="679.1" y="307.0" text-anchor="end">99.8%</text>
<text class="label" x="0" y="337.0">global-median</text>
<g><title>global-median: 33.7%</title><rect class="second" x="327.0" y="328.0" width="10" height="10"/></g>
<text x="342.0" y="337.0" text-anchor="start">33.7%</text>
</svg>
